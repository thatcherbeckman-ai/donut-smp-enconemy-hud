
name: Build DonutSMP Economy HUD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'


      - name: Build Minecraft mod
        run: |
          BUILD_FILE="$(find . -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle found"
            exit 1
          fi
          gradle -p "$(dirname "$BUILD_FILE")" build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutSMP-Economy-HUD
          path: '**/build/libs/*.jar'
          if-no-files-found: error
